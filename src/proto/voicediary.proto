syntax = "proto3";
package voicediary;

message SpeakerEmbedding {
    bytes vector = 1;           // 192 float32s packed as bytes (768 bytes)
    float audio_duration = 2;
    float confidence = 3;
    int64 timestamp = 4;
}

message Speaker {
    int32 id = 1;
    string name = 2;
    repeated SpeakerEmbedding embeddings = 3;
    int64 created_at = 4;
    int64 updated_at = 5;
    string color = 6;           // hex color for UI
}

message TranscriptEntry {
    int32 speaker_id = 1;
    string speaker_name = 2;
    string text = 3;
    string language = 4;
    double start_time = 5;
    double end_time = 6;
    int64 timestamp = 7;
    string speaker_color = 8;
}

message TranscriptSession {
    string session_id = 1;
    string session_name = 2;
    repeated TranscriptEntry entries = 3;
    int64 created_at = 4;
}

message Settings {
    string whisper_model = 1;
    float similarity_threshold = 2;
    string language = 3;
    float vad_threshold = 4;
    int32 max_embeddings = 5;
}

message SpeakerDatabase {
    repeated Speaker speakers = 1;
    int32 next_speaker_id = 2;
}
