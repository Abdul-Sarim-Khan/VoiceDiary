name: VoiceDiary CI & Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint Tools & Core Stubs
        run: |
          python -m pip install --upgrade pip
          pip install protobuf flake8

      - name: Verify Python Syntax & Clean Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          python -m flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Verify Protobuf Schemas
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from proto import voicediary_pb2; print('Protobuf schema verified successfully!')"
